<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#122945" />
  <title>Painel Comercial | UNIFAHE</title>
  <link rel="icon" href="assets/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Neue Montreal e Paralucent são as famílias oficiais da identidade UNIFAHE; Inter permanece como fallback web. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="loginView" class="login-view">
    <main class="login-shell">
      <section class="login-panel" aria-label="Acesso à Plataforma Comercial">
        <div class="login-heading">
          <img src="assets/logo-white.png" alt="UNIFAHE" class="login-logo" />
          <div class="login-title-copy">
            <h1>Login</h1>
            <p>Plataforma Comercial</p>
          </div>
        </div>

        <form id="loginForm" class="login-form" autocomplete="off">
          <label class="field">
            <span>E-mail</span>
            <div class="field-control">
              <i data-lucide="mail"></i>
              <input id="email" type="email" placeholder="seuemail@unifahe.com.br" required />
            </div>
          </label>
          <label class="field">
            <span>Senha</span>
            <div class="field-control">
              <i data-lucide="lock-keyhole"></i>
              <input id="password" type="password" placeholder="Digite sua senha" required />
              <button id="togglePassword" class="icon-button password-toggle" type="button" aria-label="Mostrar senha"><i data-lucide="eye"></i></button>
            </div>
          </label>
          <p id="loginError" class="login-error" role="alert"></p>
          <button class="primary-button" type="submit">Entrar</button>
          <div class="demo-access" aria-label="Acessos rápidos para pré-visualização">
            <span>Acessos rápidos</span>
            <div class="demo-buttons">
              <button type="button" data-demo="vendedor">Vendedor</button>
              <button type="button" data-demo="gestor">Gestor</button>
              <button type="button" data-demo="auditoria">Auditoria</button>
            </div>
          </div>
        </form>
      </section>
    </main>
  </div>

  <div id="appView" class="app-view is-hidden">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top">
        <div class="brand-wrap">
          <img src="assets/logo-white.png" alt="UNIFAHE" class="brand-full" />
          <img src="assets/favicon.ico" alt="" class="brand-mark" />
        </div>
        <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="Recolher menu"><i data-lucide="chevron-left"></i></button>
      </div>
      <nav id="sidebarNav" class="sidebar-nav" aria-label="Menu principal"></nav>
      <div class="sidebar-footer">
        <button id="logoutButton" class="nav-item logout-item" type="button" data-tooltip="Sair">
          <span class="nav-icon"><i data-lucide="log-out"></i></span><span class="nav-label">Sair</span>
        </button>
      </div>
    </aside>

    <section class="app-shell">
      <div class="global-top-controls">
        <button id="mobileMenuButton" class="mobile-menu-button" type="button" aria-label="Abrir menu"><i data-lucide="menu"></i></button>
        <button id="profileTrigger" class="profile-trigger" type="button" aria-label="Abrir perfil" aria-expanded="false">
          <span id="userAvatar" class="avatar">U</span>
        </button>
      </div>
      <main id="content" class="content"></main>
    </section>
    <button id="mobileOverlay" class="mobile-overlay" type="button" aria-label="Fechar menu"></button>
    <button id="profileOverlay" class="profile-overlay" type="button" aria-label="Fechar perfil"></button>
    <aside id="profileDrawer" class="profile-drawer" aria-label="Perfil do usuário">
      <div class="profile-drawer-head"><div><span>PERFIL</span><strong>Minha conta</strong></div><button id="profileCloseButton" type="button" aria-label="Fechar perfil"><i data-lucide="x"></i></button></div>
      <div class="profile-photo-section">
        <div id="profilePhotoPreview" class="profile-photo-preview">U</div>
        <div class="profile-identity"><strong id="userName">Usuário</strong><span id="userRole">Vendedor</span></div>
      </div>
      <div class="profile-settings-block">
        <span class="profile-settings-label">FOTO DE PERFIL</span>
        <p>Use uma imagem para identificar seu perfil no painel.</p>
        <label class="profile-photo-action" for="profilePhotoInput"><i data-lucide="camera"></i><span>Escolher foto</span></label>
        <input id="profilePhotoInput" type="file" accept="image/jpeg,image/png,image/webp" hidden>
        <button id="removeProfilePhoto" class="profile-photo-remove is-hidden" type="button"><i data-lucide="trash-2"></i>Remover foto</button>
      </div>
    </aside>
  </div>

  <div id="modalHost"></div>
  <div id="toastHost" class="toast-host" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
